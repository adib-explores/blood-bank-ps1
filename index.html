<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Donation Registration | LifeFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #e63946;
            --primary-dark: #c1121f;
            --primary-light: #ffccd5;
            --secondary: #1d3557;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --input-bg: rgba(15, 23, 42, 0.6);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --focus-ring: rgba(230, 57, 70, 0.4);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(230, 57, 70, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(29, 53, 87, 0.3) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            padding: 2.5rem 2.5rem 1.5rem 2.5rem;
            text-align: center;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(230, 57, 70, 0.15);
            border: 1px solid rgba(230, 57, 70, 0.3);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-badge svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        form {
            padding: 2.5rem;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 0.85rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
            background: rgba(15, 23, 42, 0.8);
        }

        select option {
            background-color: #1e293b;
            color: var(--text-main);
        }

        /* Blood Type Selector Pills */
        .blood-type-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.75rem;
        }

        .blood-option input[type="radio"] {
            display: none;
        }

        .blood-option label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .blood-option input[type="radio"]:checked + label {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.4);
        }

        .blood-option label:hover {
            border-color: rgba(230, 57, 70, 0.5);
        }

        /* Custom Checkbox */
        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            margin-top: 2px;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .checkbox-label a {
            color: var(--primary-light);
            text-decoration: none;
        }

        .checkbox-label a:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(230, 57, 70, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(230, 57, 70, 0.5);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .blood-type-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            form {
                padding: 1.5rem;
            }
            .header {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand-badge">
            <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            LifeFlow Registry
        </div>
        <h1>Blood Donor Registration</h1>
        <p>Every donation can save up to three lives. Fill in your details to join our hero network.</p>
    </div>

    <!-- Web3Forms Action & Hidden Access Key -->
    <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="1fd8ff24-c3ea-47ae-b549-8fc59984b144">

        <!-- Personal Information -->
        <div class="section-title">Personal Details</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="name" placeholder="e.g. Jane Doe" required>
            </div>
            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="date_of_birth" required>
            </div>
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="" disabled selected>Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                    <option value="prefer-not">Prefer not to say</option>
                </select>
            </div>
            <div class="form-group">
                <label for="weight">Weight (kg)</label>
                <input type="number" id="weight" name="weight" min="45" placeholder="e.g. 68" required>
            </div>
        </div>

        <!-- Contact Information -->
        <div class="section-title">Contact Information</div>
        <div class="form-grid">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="jane@example.com" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 000-0000" required>
            </div>
            <div class="form-group full-width">
                <label for="address">Residential Address</label>
                <input type="text" id="address" name="address" placeholder="Street Address, City, State/Province, ZIP" required>
            </div>
        </div>

        <!-- Medical & Donor Info -->
        <div class="section-title">Medical & Donor Profile</div>
        <div class="form-grid">
            <div class="form-group full-width">
                <label>Select Blood Type</label>
                <div class="blood-type-grid">
                    <div class="blood-option">
                        <input type="radio" id="a-pos" name="bloodtype" value="A+" required>
                        <label for="a-pos">A+</label>
                    </div>
                    <div class="blood-option">
                        <input type="radio" id="a-neg" name="bloodtype" value="A-">
                        <label for="a-neg">A-</label>
                    </div>
                    <div class="blood-option">
                        <input type="radio" id="b-pos" name="bloodtype" value="B+">
                        <label for="b-pos">B+</label>
                    </div>
                    <div class="blood-option">
                        <input type="radio" id="b-neg" name="bloodtype" value="B-">
                        <label for="b-neg">B-</label>
                    </div>
                    <div class="blood-option">
                        <input type="radio" id="ab-pos" name="bloodtype" value="AB+">
                        <label for="ab-pos">AB+</label>
                    </div>
                    <div class="blood-option">
                        <input type="radio" id="ab-neg" name="bloodtype" value="AB-">
                        <label for="ab-neg">AB-</label>
                    </div>
                    <div class="blood-option">
                        <input type="radio" id="o-pos" name="bloodtype" value="O+">
                        <label for="o-pos">O+</label>
                    </div>
                    <div class="blood-option">
                        <input type="radio" id="o-neg" name="bloodtype" value="O-">
                        <label for="o-neg">O-</label>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="last-donation">Last Blood Donation (If applicable)</label>
                <input type="date" id="last-donation" name="last_donation_date">
            </div>
            <div class="form-group">
                <label for="availability">Preferred Contact Method</label>
                <select id="availability" name="preferred_contact_method">
                    <option value="phone">Phone Call</option>
                    <option value="sms">SMS Text Message</option>
                    <option value="email">Email</option>
                </select>
            </div>
            <div class="form-group full-width">
                <label for="medical-history">Medical Conditions / Existing Medications / Message</label>
                <textarea id="medical-history" name="message" rows="3" placeholder="Please list any chronic illnesses, recent surgeries, ongoing medications, or additional comments..."></textarea>
            </div>
        </div>

        <!-- Consent -->
        <div class="form-group full-width" style="margin-bottom: 2rem;">
            <label class="checkbox-group">
                <input type="checkbox" name="consent" value="agreed" required>
                <span class="checkbox-label">
                    I confirm that the information provided is accurate. I agree to the <a href="#">Terms of Donation</a> and give consent to be contacted for emergency blood donation requests.
                </span>
            </label>
        </div>

        <button type="submit" class="submit-btn">
            Register as a Donor
        </button>
    </form>
</div>

</body>
</html>
